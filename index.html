<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>8D Spatial Audio Pro - Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial; background: #0b0b0b; color: #fff; text-align: center; padding: 30px; }
        .box { background: #161616; padding: 40px; border-radius: 20px; display: inline-block; box-shadow: 0 10px 40px rgba(0,0,0,0.7); border: 1px solid #222; }
        button { padding: 12px 25px; font-size: 14px; margin: 8px; cursor: pointer; border-radius: 50px; border: none; font-weight: bold; transition: 0.3s; color: white; background: #333; }
        .play { background: #00ff88; color: #000; }
        .stop { background: #ff416c; }
        .active { background: #f1c40f !important; color: #000; box-shadow: 0 0 15px #f1c40f; }
        #status { color: #888; margin-top: 20px; font-family: monospace; }
        input[type="file"] { margin: 20px; background: #222; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="box">
    <h2>🌀 Spatial Engine v2.0</h2>
    <p style="color: #666; font-size: 13px;">Independence Mode: Vocals vs Instruments</p>
    
    <input type="file" id="fileInput" accept="audio/*">
    <br>
    <button class="play" >▶ START AUDIO</button>
    <button class="stop" >⏹ STOP</button>
    <br><br>
    <button id="btn8d" >Multi-8D: OFF</button>
    <button id="btnLofi" >Lofi: OFF</button>
    <button id="btnBass">Bass Boost: OFF</button>

    <p id="status">System Standby</p>
    <script src="test.js"></script>
</div>
</body>
</html>
